[package]
name = "kronos_ast"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.8"
regex = "1.10"
base64 = "0.22"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json", "tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }


[build-dependencies]
slint-build = "1.8"
